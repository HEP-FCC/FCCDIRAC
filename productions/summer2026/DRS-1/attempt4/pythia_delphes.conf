[gaudiapp_gen]
ExecutableName = k4run
SteeringFile = pythia_gen.py
GaudiWorkFlow = fastsim
ExtraCLIArguments = --GenAlg.PythiaInterface.pythiacard pythia8card.cmd
OutputFileFlag = --HepMCFileWriter.Filename
Version = key4hep_nightly

[gaudiapp_sim]
ExecutableName = k4run
SteeringFile = delphes_sim.py
ExtraCLIArguments = --k4SimDelphesAlg.DelphesCard card_IDEA.tcl --k4SimDelphesAlg.DelphesOutputSettings edm4hep_IDEA.tcl
InputFileFlag = --GenAlg.HepMCFileReader.Filename
OutputFileFlag = --IOSvc.Output
Version = key4hep_nightly

[Production Parameters]
machine = ee
prodGroup = DRS-1

softwareVersion = key4hep_nightly
generatorApplication = gaudiapp_gen
simulationApplication = gaudiapp_sim

configVersion = key4hep-devel-7
configPackage = fccConfig

eventsPerJobs = 100, 100, 100
numberOfTasks = 1, 1, 1

campaign = summer2026
energies = 240, 240, 240
processes = ZH, ZZ, WW
detectorModel = IDEA
generatorSteeringFile = p8_ee_ZH_ecm240.cmd, p8_ee_ZZ_ecm240.cmd, p8_ee_WW_ecm240.cmd

additionalName = DRS-1_attempt4
productionLogLevel = VERBOSE
outputSE = CERN-DST-EOS

finalOutputSE = CERN-SRM
MoveStatus = Stopped
MoveGroupSize = 10

ProdTypes = Gen, Sim
