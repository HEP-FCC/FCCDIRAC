# Single-process Pythia8 + Delphes training configuration.
# Replace REPLACE_WITH_CERN_USERNAME before running the iLCDirac dry run.
# Training campaign: summer2026. Clean up the training output afterwards.
# Use the software and storage values agreed for the session.
# Local detector/output cards are for training only; package them for production.

[delphesapp]
ExecutableName = DelphesPythia8_EDM4HEP
DetectorCard = card_IDEA.tcl
OutputCard = edm4hep_IDEA.tcl
Version = key4hep_260408

[Production Parameters]
machine = ee
prodGroup = mccontacts_training
softwareVersion = key4hep_260408
generatorApplication = delphesapp
generatorSteeringFile = p8_ee_ZH_ecm240.cmd
configVersion = key4hep-devel-6
configPackage = fccConfig

eventsPerJobs = 100
numberOfTasks = 1
campaign = summer2026
energies = 240
processes = ZH
detectorModel = IDEA
additionalName = training_snaseem_attempt1

productionLogLevel = VERBOSE
outputSE = CERN-DST-EOS
ProdTypes = Gen
move = False
